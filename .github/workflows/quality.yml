name: CI code quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Static analysis
        run: python -m pylint src/status.py --score=no
      - name: Validate documentation before merge
        run: mkdocs build --strict --site-dir site
